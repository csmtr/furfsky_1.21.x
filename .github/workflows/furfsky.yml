name: Download File

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL of the file to download'
        required: true
        default: 'https://example.com/file.zip'
      file_name:
        description: 'Name to save the file as'
        required: true
        default: 'downloaded_file'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Download the file
      - name: Download file
        run: |
          wget -O ${{ github.inputs.file_name }} ${{ github.inputs.file_url }}

      # Upload the file as an artifact
      - name: Upload file as artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.inputs.file_name }}
          path: ./${{ github.inputs.file_name }}
