name: FurfSky Upgrader

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL of the file to download'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Download the file
      - name: Download file
        run: |
          wget -O furfsky_1.21.x.zip ${{ github.event.inputs.file_url }}

      # Upload the file as an artifact
      - name: Upload file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "furfsky_1.21.x.zip"
          path: ./furfsky_1.21.x.zip
